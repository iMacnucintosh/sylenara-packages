name: Build packages

on:
  schedule:
    # New releases of Lunele's repos, AUR updates and new versions of Qt or Python in Arch
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      all:
        description: "Rebuild everything"
        type: boolean
        default: false

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 300
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git github-cli jq python

      - uses: actions/checkout@v4

      - name: Current repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p repo
          gh release view x86_64 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create x86_64 --repo "$GITHUB_REPOSITORY" --title "Lunele packages (x86_64)" \
              --notes "The pacman repository of Lunele. Do not download from here: the installer sets it up."
          gh release download x86_64 --repo "$GITHUB_REPOSITORY" --dir repo \
            --pattern 'lunele.db' --pattern 'lunele.files' --pattern 'state.json' || true

      - name: Plan
        id: plan
        run: |
          python3 scripts/plan.py repo/state.json new-state.json ${{ inputs.all && '--all' || '' }} > plan.json
          jq -r '.[] | "\(.name): \(.was) → \(.fingerprint)"' plan.json
          echo "count=$(jq length plan.json)" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.plan.outputs.count != '0'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: bash scripts/build.sh plan.json repo

      - name: Publish
        if: steps.plan.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish.sh repo new-state.json
